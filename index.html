    const generate90DayPlan = () => {
      const days = [];
      const phases = [
        { month: 1, name: 'Month 1: Foundation & Fat-Loss Ignition', repMultiplier: 1.0, setBonus: 0, durationBonus: 0 },
        { month: 2, name: 'Month 2: Muscle Growth & Calorie Burn', repMultiplier: 1.25, setBonus: 1, durationBonus: 10 },
        { month: 3, name: 'Month 3: Peak Strength & Glucose Mastery', repMultiplier: 1.45, setBonus: 1, durationBonus: 15 }
      ];

      const weeklyTemplates = [
        { dayOfWeek: 1, title: 'Lower Body Strength & Glucose Sink', focus: 'Bodyweight + Resistance Legs', exerciseIds: ['pelvic-hip-circles', 'bw-squat', 'romanian-deadlift', 'bw-reverse-lunge', 'calf-pump', 'hip-hinge-stretch'] },
        { dayOfWeek: 2, title: 'Upper Body Push/Pull & Boxing Burn', focus: 'Upper Muscle + Cardio', exerciseIds: ['thoracic-opener', 'wall-pushup', 'standing-row', 'standing-overhead-press', 'metabolic-boxing'] },
        { dayOfWeek: 3, title: 'Weight-Loss Cardio & Core Circuit', focus: 'Fat Burn + Core Stability', exerciseIds: ['thoracic-opener', 'cardio-knee-march', 'bw-squat', 'bw-plank-climber', 'metabolic-boxing', 'hip-hinge-stretch'] },
        { dayOfWeek: 4, title: 'Full-Body Resistance Hypertrophy', focus: 'Muscle Growth (Dumbbell / Band)', exerciseIds: ['pelvic-hip-circles', 'goblet-squat', 'standing-row', 'romanian-deadlift', 'bicep-hammer-curl', 'calf-pump'] },
        { dayOfWeek: 5, title: 'Bodyweight Sculpt & Metabolic March', focus: 'Bodyweight + Fat Burn', exerciseIds: ['pelvic-hip-circles', 'bw-reverse-lunge', 'wall-pushup', 'bw-plank-climber', 'cardio-knee-march', 'thoracic-opener'] },
        { dayOfWeek: 6, title: 'Upper Strength, Hamstrings & Mobility', focus: 'Resistance + Flexibility', exerciseIds: ['thoracic-opener', 'goblet-squat', 'standing-overhead-press', 'bicep-hammer-curl', 'romanian-deadlift', 'hip-hinge-stretch'] },
        { dayOfWeek: 7, title: 'Active Recovery, Mobility & Circulation', focus: 'Gentle Flow & Stretch', exerciseIds: ['thoracic-opener', 'cardio-knee-march', 'pelvic-hip-circles', 'calf-pump', 'hip-hinge-stretch'] }
      ];

      for (let d = 1; d <= 90; d++) {
        const monthIndex = d <= 30 ? 0 : d <= 60 ? 1 : 2;
        const phase = phases[monthIndex];
        const weekNumber = Math.ceil(d / 7);
        const dayOfWeekIndex = (d - 1) % 7;
        const template = weeklyTemplates[dayOfWeekIndex];
        const weekProgression = Math.floor((d - 1) / 14);

        const exercises = template.exerciseIds.map((id) => {
          const baseEx = EXERCISE_CATALOG.find((e) => e.id === id);
          const isRecoveryDay = template.dayOfWeek === 7;
          const sets = isRecoveryDay ? baseEx.defaultSets : baseEx.defaultSets + phase.setBonus;
          const reps = Math.round(baseEx.defaultReps * phase.repMultiplier) + (weekProgression % 2);
          const durationSec = baseEx.defaultDurationSec + phase.durationBonus;

          return {
            ...baseEx,
            targetSets: sets,
            targetReps: reps,
            targetDurationSec: durationSec,
            estimatedCalories: Math.round((baseEx.caloriesPerSet || 15) * sets)

        const totalEstimatedMinutes = Math.round(
          exercises.reduce((acc, ex) => acc + ex.targetSets * (ex.targetDurationSec + ex.restSec), 0) / 60

        days.push({
          dayNumber: d,
          month: phase.month,
          phaseName: phase.name,
          weekNumber,
          title: template.title,
          focus: template.focus,
          estimatedMinutes: totalEstimatedMinutes,
          estimatedCalories: totalEstimatedCalories,
          exercises

        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;
        if (type === 'start') {
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.12);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'complete') {
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          osc.frequency.setValueAtTime(783.99, now + 0.2);
          gain.gain.setValueAtTime(0.12, now);

                    viewMode === mode.id
                      ? 'bg-gradient-to-r from-emerald-500 to-teal-500 text-white shadow-sm'
                      : 'text-slate-600 hover:bg-slate-100'
                  }`}
                >
                  {mode.label}
                </button>
              ))}
            </div>

            {viewMode === 'video' && (
              <div className="flex items-center gap-1.5">
                {clips.map((clip, idx) => (
                  <button
                    key={clip.id + idx}
                    onClick={() => setSelectedClipIdx(idx)}
                    className={`flex-1 py-1.5 px-2 rounded-xl text-[11px] font-black border transition-all truncate ${
                      selectedClipIdx === idx
                        ? 'bg-sky-500 text-white border-sky-600 shadow-sm'
                        : 'bg-white text-slate-700 border-emerald-200 hover:bg-emerald-50'
                    }`}
                  >
                    🎬 {clip.label}
                  </button>
                ))}
                <button
                  onClick={() => setIframeKey((k) => k + 1)}
                  title="Reload Video"
                  className="px-2 py-1.5 rounded-xl bg-white hover:bg-emerald-50 text-slate-700 border border-emerald-200 text-xs font-black shrink-0"
                >
                  ↻
                </button>
              </div>
            )}
          </div>

          <div className="relative w-full h-[290px] bg-slate-950 overflow-hidden">
            {viewMode === 'video' ? (
              <div className="relative w-full h-full bg-slate-950">
                <iframe
                  key={`${activeClip.id}-${iframeKey}`}
                  src={embedSrc}
                  title={exercise.name}
                  className="w-full h-full border-0"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  referrerPolicy="strict-origin-when-cross-origin"
                  allowFullScreen
                />
              </div>
            ) : (
              <div className="relative w-full h-full overflow-hidden">
                <ArticulatedStickModel exercise={exercise} />
              </div>
            )}
          </div>

          <div className="px-3 py-2 bg-emerald-950 text-white flex items-center justify-between gap-2 text-xs">
            <div className="truncate font-bold text-emerald-100">
              <span className="text-emerald-400 font-black mr-1">🎯 Form Cue:</span>
              {activeClip.tip}
            </div>
            <button
              onClick={() => setViewMode(viewMode === 'video' ? 'stick' : 'video')}
              className="px-2 py-0.5 rounded-lg bg-emerald-800 hover:bg-emerald-700 text-[10px] font-black text-amber-300 shrink-0 border border-emerald-600"
            >
              {viewMode === 'video' ? 'Switch to 🦴 Stick' : 'Switch to 📺 Short'}
            </button>
          </div>

          <div className="p-2.5 bg-white border-t border-emerald-100 space-y-2">
            {onStartAfterWatch && (
              <button
                onClick={onStartAfterWatch}
                className="w-full py-2 px-3 rounded-2xl bg-emerald-100/90 hover:bg-emerald-200/80 text-emerald-950 border border-emerald-300 text-xs font-black flex items-center justify-center gap-1.5 shadow-sm active:scale-95 transition-all"
              >
                <span>✅ Watched Demo? Tap to Start Exercise Timer Now</span>
              </button>
            )}

            <button
              onClick={() => setShowTipsDrawer(!showTipsDrawer)}
              className="w-full py-2.5 px-3.5 rounded-2xl bg-gradient-to-r from-emerald-50 via-sky-50 to-amber-50 hover:from-emerald-100 hover:to-amber-100 border border-emerald-200 text-xs font-black text-slate-800 flex items-center justify-between shadow-sm transition-all"
            >
              <span>✨ Exercise Details (Form Steps • Joint Mod • Glucose)</span>
              <span className="px-2 py-0.5 rounded-full bg-white text-emerald-800 border border-emerald-200 text-[10px]">
                {showTipsDrawer ? 'Close ▲' : 'Open ▼'}
              </span>
            </button>

            {showTipsDrawer && (
              <div className="mt-2.5 pt-2.5 border-t border-emerald-100 space-y-2.5">
                <div className="grid grid-cols-3 gap-1.5">
                  {[
                    { id: 'steps', label: '1. Form Steps' },
                    { id: 'easier', label: '2. Joint Mod' },
                    { id: 'benefit', label: '3. Glucose Burn' }
                  ].map((tab) => (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTipTab(tab.id)}
                      className={`py-2 px-2 rounded-xl text-[11px] font-black border transition-all ${
                        activeTipTab === tab.id
                          ? 'bg-emerald-500 text-white border-emerald-600 shadow-sm'
                          : 'bg-slate-50 text-slate-700 border-slate-200'
                      }`}
                    >
                      {tab.label}
                    </button>
                  ))}
                </div>

                {activeTipTab === 'steps' && (
                  <div className="bg-emerald-50/80 p-3 rounded-2xl space-y-1.5 text-xs text-slate-800 border border-emerald-200">
                    <div className="font-black text-emerald-900">
                      ⏱ Tempo: {exercise.tempo}
                    </div>
                    {exercise.cues.map((c, idx) => (
                      <div key={idx} className="flex items-start gap-2">
                        <span className="w-5 h-5 rounded-full bg-white text-emerald-800 font-black flex items-center justify-center shrink-0 text-[11px] border border-emerald-300">
                          {idx + 1}
                        </span>
                        <span className="font-medium leading-snug">{c}</span>
                      </div>
                    ))}
                  </div>
                )}

                {activeTipTab === 'easier' && (
                  <div className="bg-sky-50 p-3 rounded-2xl text-xs text-slate-800 space-y-1.5 border border-sky-200">
                    <div className="font-black text-sky-900">
                      🪑 Joint-Safe Option: {exercise.seatedAlternative}
                    </div>
                    <div>
                      <strong>Breathing Pattern:</strong> {exercise.breathing}
                    </div>
                  </div>
                )}

                {activeTipTab === 'benefit' && (
                  <div className="bg-amber-50 p-3 rounded-2xl text-xs text-slate-800 space-y-1.5 border border-amber-200">
                    <div className="font-black text-amber-900">
                      🩸 Diabetic & Weight-Loss Benefit:
                    </div>
                    <div>{exercise.glycemicBenefit}</div>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    };

    function App() {
      const saved = useMemo(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (e) {
          return null;
        }
      }, []);

      const [activeSection, setActiveSection] = useState(1);
      const [currentDayNum, setCurrentDayNum] = useState(saved?.currentDayNum || 1);
      const [activeExIndex, setActiveExIndex] = useState(0);
      const [selectedMonth, setSelectedMonth] = useState(1);
      const [openWeekNum, setOpenWeekNum] = useState(1);
      const [completedExercisesByDay, setCompletedExercisesByDay] = useState(
        saved?.completedExercisesByDay || {}
      );
      const [glucoseReading, setGlucoseReading] = useState(saved?.glucoseReading || 135);
      const [showHeaderCareDrawer, setShowHeaderCareDrawer] = useState(false);
      const [showDayPickerDrawer, setShowDayPickerDrawer] = useState(false);
      const [showTipsDrawer, setShowTipsDrawer] = useState(false);
      const [activeTipTab, setActiveTipTab] = useState('steps');
      const [voiceEnabled, setVoiceEnabled] = useState(true);

      const [isTimerRunning, setIsTimerRunning] = useState(false);
      const [isResting, setIsResting] = useState(false);
      const [secondsLeft, setSecondsLeft] = useState(45);
      const [currentSet, setCurrentSet] = useState(1);
      const [currentReps, setCurrentReps] = useState(0);

      const [categoryFilter, setCategoryFilter] = useState('All');
      const [expandedCatalogId, setExpandedCatalogId] = useState(EXERCISE_CATALOG[0].id);

      useEffect(() => {
        try {
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({ currentDayNum, completedExercisesByDay, glucoseReading })
          );
        } catch (e) {}
      }, [currentDayNum, completedExercisesByDay, glucoseReading]);

      const currentDayPlan = useMemo(
        () => FULL_90_DAY_PLAN.find((d) => d.dayNumber === currentDayNum) || FULL_90_DAY_PLAN[0],
        [currentDayNum]
      );

      const currentExercise =
        currentDayPlan.exercises[activeExIndex] || currentDayPlan.exercises[0];

      useEffect(() => {
        setIsTimerRunning(false);
        setIsResting(false);
        setCurrentSet(1);
        setCurrentReps(0);
        setSecondsLeft(currentExercise.targetDurationSec);
      }, [activeExIndex, currentDayNum, currentExercise.targetDurationSec]);

      useEffect(() => {
        if (!isTimerRunning) return;
        const timer = setInterval(() => {
          setSecondsLeft((prev) => {
            if (prev <= 1) {
              if (!isResting) {
                playSoundCue('complete');
                if (currentSet < currentExercise.targetSets) {
                  setIsResting(true);
                  speakCoachText(
                    `Set ${currentSet} complete! Rest and breathe for ${currentExercise.restSec} seconds.`,
                    voiceEnabled
                  );
                  return currentExercise.restSec;
                } else {
                  setIsTimerRunning(false);
                  markExerciseDone(currentDayNum, currentExercise.id);
                  speakCoachText(
                    `Awesome work! ${currentExercise.name} finished.`,
                    voiceEnabled
                  );
                  return 0;
                }
              } else {
                playSoundCue('start');
                setIsResting(false);
                setCurrentSet((s) => s + 1);
                setCurrentReps(0);
                speakCoachText(
                  `Starting Set ${currentSet + 1} of ${currentExercise.name}.`,
                  voiceEnabled
                );
                return currentExercise.targetDurationSec;
              }
            }
            if (!isResting && prev % 4 === 0) {
              setCurrentReps((r) => (r < currentExercise.targetReps ? r + 1 : r));
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [isTimerRunning, isResting, currentSet, currentExercise, currentDayNum, voiceEnabled]);

      const markExerciseDone = (dayNum, exId) => {
        setCompletedExercisesByDay((prev) => {
          const list = prev[dayNum] || [];
          const updated = list.includes(exId) ? list : [...list, exId];
          return { ...prev, [dayNum]: updated };
        });
      };

      const dayDoneList = completedExercisesByDay[currentDayNum] || [];
      const isCurrentExDone = dayDoneList.includes(currentExercise.id);
      const repProgressPct = Math.min(
        100,
        Math.round((currentReps / Math.max(1, currentExercise.targetReps)) * 100)
      );
      const totalTimerMax = isResting
        ? currentExercise.restSec
        : currentExercise.targetDurationSec;
      const timerProgressPct = Math.min(
        100,
        Math.max(0, Math.round(((totalTimerMax - secondsLeft) / Math.max(1, totalTimerMax)) * 100))
      );

      const handleStartOrPauseTimer = () => {
        if (!isTimerRunning) {
          playSoundCue('start');
          speakCoachText(
            `Starting ${currentExercise.name}. ${currentExercise.cues[0]}`,
            voiceEnabled
          );
        }
        setIsTimerRunning(!isTimerRunning);
      };

      const handleNextStepOrSet = () => {
        playSoundCue('complete');
        if (currentSet < currentExercise.targetSets) {
          setIsResting(false);
          setCurrentSet((s) => s + 1);
          setCurrentReps(0);
          setSecondsLeft(currentExercise.targetDurationSec);
          setIsTimerRunning(true);
        } else {
          markExerciseDone(currentDayNum, currentExercise.id);
          setIsTimerRunning(false);
          if (activeExIndex < currentDayPlan.exercises.length - 1) {
            setActiveExIndex((i) => i + 1);
          }
        }
      };

      const weeksInSelectedMonth = useMemo(() => {
        const monthDays = FULL_90_DAY_PLAN.filter((d) => d.month === selectedMonth);
        const grouped = {};
        monthDays.forEach((d) => {
          if (!grouped[d.weekNumber]) grouped[d.weekNumber] = [];
          grouped[d.weekNumber].push(d);
        });
        return Object.entries(grouped).map(([weekNum, days]) => ({
          weekNum: Number(weekNum),
          days
        }));
      }, [selectedMonth]);

      return (
        <div className="min-h-screen flex flex-col items-center">
          <div className="w-full max-w-md min-h-screen bg-white/95 backdrop-blur-md border-x border-emerald-200 shadow-xl flex flex-col">
            <header className="sticky top-0 z-30 bg-gradient-to-r from-emerald-50 via-sky-50 to-amber-50 border-b-2 border-emerald-200 px-4 py-3">
              <div className="flex items-center justify-between gap-1.5">
                <div className="flex items-center gap-2 min-w-0">
                  <div className="w-9 h-9 rounded-2xl bg-gradient-to-tr from-emerald-500 via-teal-400 to-sky-500 text-white flex items-center justify-center font-black text-xs shadow-sm shrink-0">
                    G90
                  </div>
                  <div className="min-w-0">
                    <h1 className="text-sm font-black text-slate-900 leading-tight truncate">
                      GlucoStrong 90
                    </h1>
                    <p className="text-[11px] font-extrabold text-emerald-700 truncate">
                      Day {currentDayNum}/90 • 🔥 {currentDayPlan.estimatedCalories} kcal
                    </p>
                  </div>
                </div>

                <div className="flex items-center gap-1.5 shrink-0">
                  <button
                    onClick={() => setShowHeaderCareDrawer(!showHeaderCareDrawer)}
                    className="px-2.5 py-1.5 rounded-2xl bg-white hover:bg-emerald-50 text-emerald-900 border-2 border-emerald-200 text-[11px] font-black shadow-sm flex items-center gap-1 active:scale-95 transition-all"
                  >
                    <span>🩸 {glucoseReading} mg/dL</span>
                    <span className="text-[9px] text-emerald-600">
                      {showHeaderCareDrawer ? '▲' : '▼'}
                    </span>
                  </button>
                </div>
              </div>

              {showHeaderCareDrawer && (
                <div className="mt-3 p-3.5 rounded-2xl bg-white border-2 border-emerald-200 space-y-2.5 shadow-sm">
                  <div className="flex justify-between items-center text-xs font-black text-slate-800">
                    <span>Pre-Workout Blood Sugar Check:</span>
                    <span className="text-emerald-700">{glucoseReading} mg/dL</span>
                  </div>
                  <input
                    type="range"
                    min="70"
                    max="300"
                    value={glucoseReading}
                    onChange={(e) => setGlucoseReading(Number(e.target.value))}
                    className="w-full accent-emerald-500 cursor-pointer"
                  />
                  <p className="text-[11px] font-bold text-slate-700">
                    {glucoseReading < 100
                      ? '⚠️ Under 100 mg/dL: Take 15g fast carbs before exercising.'
                      : glucoseReading <= 180
                      ? '✅ Safe Zone (100–180 mg/dL): Ideal to build muscle & burn fat!'
                      : '💧 Over 180 mg/dL: Drink water; steady movement lowers glucose.'}
                  </p>
                  <div className="pt-2 border-t border-slate-100 flex items-center justify-between">
                    <span className="text-xs font-black text-slate-700">
                      🔊 Interactive Voice Coach
                    </span>
                    <button
                      onClick={() => setVoiceEnabled(!voiceEnabled)}
                      className={`px-3 py-1 rounded-xl text-xs font-black ${
                        voiceEnabled
                          ? 'bg-emerald-500 text-white'
                          : 'bg-slate-200 text-slate-600'
                      }`}
                    >
                      {voiceEnabled ? 'Voice ON' : 'Voice OFF'}
                    </button>
                  </div>
                </div>
              )}

              <div className="grid grid-cols-3 gap-2 mt-3">
                {[
                  {
                    id: 1,
                    label: 'Today Workout',
                    activeStyle:
                      'bg-gradient-to-b from-emerald-500 to-teal-500 text-white border-emerald-600 shadow-md scale-[1.02]',
                    idleStyle: 'bg-white text-emerald-950 border-emerald-200'
                  },
                  {
                    id: 2,
                    label: '90-Day Plan',
                    activeStyle:
                      'bg-gradient-to-b from-sky-500 to-cyan-500 text-white border-sky-600 shadow-md scale-[1.02]',
                    idleStyle: 'bg-white text-sky-950 border-sky-200'
                  },
                  {
                    id: 3,
                    label: 'Shorts & Reps',
                    activeStyle:
                      'bg-gradient-to-b from-amber-500 to-orange-500 text-white border-amber-600 shadow-md scale-[1.02]',
                    idleStyle: 'bg-white text-amber-950 border-amber-200'
                  }
                ].map((t) => (
                  <button
                    key={t.id}
                    onClick={() => setActiveSection(t.id)}
                    className={`py-2.5 px-2 rounded-2xl border-2 text-center transition-all ${
                      activeSection === t.id ? t.activeStyle : t.idleStyle
                    }`}
                  >
                    <div className="text-xs font-black leading-tight">{t.label}</div>
                  </button>
                ))}
              </div>
            </header>

            <main className="flex-1 p-4 space-y-4 pb-8">
              {activeSection === 1 && (
                <div className="space-y-3.5">
                  <div className="bg-gradient-to-r from-emerald-100/90 via-teal-50 to-sky-100/90 rounded-3xl p-3.5 border-2 border-emerald-200 shadow-sm">
                    <div className="flex items-center justify-between gap-2">
                      <div>
                        <span className="text-[10px] font-black uppercase text-emerald-900 bg-white px-2.5 py-0.5 rounded-full border border-emerald-200">
                          Day {currentDayNum} • Exercise {activeExIndex + 1} of{' '}
                          {currentDayPlan.exercises.length}
                        </span>
                        <h2 className="text-sm font-black text-slate-900 mt-1">
                          {currentDayPlan.title}
                        </h2>
                      </div>
                      <button
                        onClick={() => setShowDayPickerDrawer(!showDayPickerDrawer)}
                        className="px-3 py-1.5 rounded-xl bg-white hover:bg-emerald-50 text-emerald-900 border border-emerald-300 font-black text-xs shrink-0 shadow-sm"
                      >
                        {showDayPickerDrawer ? 'Close ▲' : 'Switch Ex / Day ▼'}
                      </button>
                    </div>

                    {showDayPickerDrawer && (
                      <div className="mt-3 pt-3 border-t border-emerald-200/80 space-y-2.5">
                        <div className="flex items-center justify-between bg-white px-3 py-2 rounded-2xl border border-emerald-200">
                          <span className="text-xs font-black text-slate-700">
                            Change Workout Day (1–90):
                          </span>
                          <div className="flex items-center gap-1.5">
                            <button
                              onClick={() => {
                                setCurrentDayNum((d) => Math.max(1, d - 1));
                                setActiveExIndex(0);
                              }}
                              className="px-2.5 py-1 rounded-xl bg-emerald-100 text-emerald-900 font-black text-xs"
                            >
                              ◀ Prev Day
                            </button>
                            <button
                              onClick={() => {
                                setCurrentDayNum((d) => Math.min(90, d + 1));
                                setActiveExIndex(0);
                              }}
                              className="px-2.5 py-1 rounded-xl bg-emerald-500 text-white font-black text-xs"
                            >
                              Next Day ▶
                            </button>
                          </div>
                        </div>

                        <div className="flex gap-1.5 overflow-x-auto no-scrollbar">
                          {currentDayPlan.exercises.map((ex, idx) => {
                            const done = dayDoneList.includes(ex.id);
                            const active = idx === activeExIndex;
                            return (
                              <button
                                key={ex.id}
                                onClick={() => {
                                  setActiveExIndex(idx);
                                  setShowDayPickerDrawer(false);
                                }}
                                className={`px-3 py-1.5 rounded-xl text-xs font-black shrink-0 border transition-all ${
                                  active
                                    ? 'bg-emerald-500 text-white border-emerald-600 shadow-sm'
                                    : done
                                    ? 'bg-emerald-200 text-emerald-950 border-emerald-300'
                                    : 'bg-white text-slate-700 border-emerald-200'
                                }`}
                              >
                                Ex {idx + 1}: {ex.name.split(' ')[1] || ex.name.split(' ')[0]}{' '}
                                {done ? '✓' : ''}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    )}
                  </div>

                  <div className="bg-white rounded-3xl border-2 border-emerald-200 p-4 shadow-md space-y-3.5">
                    <div className="flex items-center justify-between gap-2">
                      <div>
                        <span
                          className={`inline-block text-[10px] font-black px-2.5 py-0.5 rounded-full border ${currentExercise.themeBadge}`}
                        >
                          {currentExercise.category} • {currentExercise.muscleGroup}
                        </span>
                        <h3 className="text-lg font-black text-slate-900 mt-0.5">
                          {currentExercise.name}
                        </h3>
                      </div>
                      {isCurrentExDone && (
                        <span className="px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 font-black text-xs shrink-0">
                          ✓ Done
                        </span>
                      )}
                    </div>

                    <InAppShortPlayer
                      exercise={currentExercise}
                      showTipsDrawer={showTipsDrawer}
                      setShowTipsDrawer={setShowTipsDrawer}
                      activeTipTab={activeTipTab}
                      setActiveTipTab={setActiveTipTab}
                      onSpeakCue={() =>
                        speakCoachText(
                          `${currentExercise.name}. ${currentExercise.cues.join(' ')}`,
                          true
                        )
                      }
                      onStartAfterWatch={() => {
                        if (!isTimerRunning) {
                          handleStartOrPauseTimer();
                        }
                      }}
                    />

                    <div className="rounded-3xl p-4 bg-gradient-to-r from-emerald-50 via-teal-50 to-amber-50 border-2 border-emerald-200 space-y-3">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-black text-emerald-950">
                          {isResting
                            ? '💧 Rest & Breathe'
                            : `🔥 Set ${currentSet} of ${currentExercise.targetSets}`}
                        </span>
                        <span className="text-xs font-black bg-white text-emerald-800 px-3 py-0.5 rounded-full border border-emerald-200">
                          Goal: {currentExercise.targetSets} Sets × {currentExercise.targetReps} Reps
                        </span>
                      </div>

                      <div className="grid grid-cols-2 gap-2.5">
                        <div className="bg-white rounded-2xl p-3 border-2 border-emerald-200 text-center shadow-sm flex flex-col justify-between">
                          <div className="text-[10px] font-black uppercase text-emerald-700">
                            {isResting ? 'Rest Countdown' : 'Workout Timer'}
                          </div>
                          <div className="text-3xl font-black text-emerald-600 font-mono my-1">
                            00:{String(secondsLeft).padStart(2, '0')}
                          </div>
                          <div className="w-full h-2 bg-emerald-100 rounded-full overflow-hidden">
                            <div
                              className="h-full bg-gradient-to-r from-emerald-400 to-sky-500 transition-all duration-300"
                              style={{ width: `${timerProgressPct}%` }}
                            />
                          </div>
                        </div>

                        <div
                          onClick={() => {
                            playSoundCue('start');
                            setCurrentReps((r) => r + 1);
                          }}
                          className="cursor-pointer bg-white hover:bg-amber-50/70 active:scale-95 transition-all rounded-2xl p-3 border-2 border-amber-300 text-center shadow-sm flex flex-col justify-between pulse-soft"
                        >
                          <div className="text-[10px] font-black uppercase text-amber-800">
                            👆 Tap Here (+1 Rep)
                          </div>
                          <div className="text-3xl font-black text-amber-600 font-mono my-1">
                            {currentReps}/{currentExercise.targetReps}
                          </div>
                          <div className="w-full h-2 bg-amber-100 rounded-full overflow-hidden">
                            <div
                              className="h-full bg-gradient-to-r from-amber-400 to-emerald-500 transition-all duration-300"
                              style={{ width: `${repProgressPct}%` }}
                            />
                          </div>
                        </div>
                      </div>

                      <div className="flex gap-2">
                        <button
                          onClick={handleStartOrPauseTimer}
                          className={`flex-1 py-3.5 rounded-2xl font-black text-xs shadow-md transition-transform active:scale-95 ${
                            isTimerRunning
                              ? 'bg-amber-400 text-slate-950'
                              : 'bg-gradient-to-r from-emerald-500 to-teal-500 text-white'
                          }`}
                        >
                          {isTimerRunning
                            ? '⏸ Pause Timer'
                            : `▶ Start Exercise & Timer (${secondsLeft}s)`}
                        </button>
                        <button
                          onClick={handleNextStepOrSet}
                          className="px-4 py-3.5 rounded-2xl bg-sky-500 hover:bg-sky-600 text-white font-black text-xs shadow-md active:scale-95"
                        >
                          {currentSet < currentExercise.targetSets ? 'Next Set ▶' : 'Next Ex ▶'}
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {activeSection === 2 && (
                <div className="space-y-3.5">
                  <div className="bg-gradient-to-r from-sky-100 via-cyan-50 to-emerald-100 rounded-3xl border-2 border-sky-200 p-4 space-y-2.5">
                    <span className="text-[10px] font-black uppercase text-sky-900 bg-white px-2.5 py-0.5 rounded-full border border-sky-200">
                      3-Month (90-Day) Schedule
                    </span>
                    <h2 className="text-base font-black text-slate-900">
                      Choose a Month, Then Tap Any Day
                    </h2>
                    <div className="grid grid-cols-3 gap-2">
                      {[
                        { m: 1, title: 'Month 1', sub: 'Days 1–30', weekStart: 1 },
                        { m: 2, title: 'Month 2', sub: 'Days 31–60', weekStart: 5 },
                        { m: 3, title: 'Month 3', sub: 'Days 61–90', weekStart: 9 }
                      ].map((item) => (
                        <button
                          key={item.m}
                          onClick={() => {
                            setSelectedMonth(item.m);
                            setOpenWeekNum(item.weekStart);
                          }}
                          className={`p-2.5 rounded-2xl border-2 text-center transition-all ${
                            selectedMonth === item.m
                              ? 'bg-sky-500 text-white border-sky-600 font-black shadow-sm'
                              : 'bg-white text-slate-700 border-sky-200 font-bold'
                          }`}
                        >
                          <div className="text-xs">{item.title}</div>
                          <div className="text-[10px] opacity-85">{item.sub}</div>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="space-y-2.5">
                    {weeksInSelectedMonth.map(({ weekNum, days }) => {
                      const isWeekOpen = openWeekNum === weekNum;
                      return (
                        <div
                          key={weekNum}
                          className="bg-white rounded-3xl border-2 border-sky-200 overflow-hidden shadow-sm"
                        >
                          <button
                            onClick={() => setOpenWeekNum(isWeekOpen ? null : weekNum)}
                            className="w-full p-3.5 bg-sky-50/70 flex items-center justify-between text-left"
                          >
                            <div>
                              <span className="text-[11px] font-black text-sky-700 uppercase">
                                Week {weekNum}
                              </span>
                              <h3 className="text-sm font-black text-slate-900">
                                Days {days[0].dayNumber} – {days[days.length - 1].dayNumber}
                              </h3>
                            </div>
                            <span className="px-3 py-1 rounded-xl bg-white text-sky-800 border border-sky-200 text-xs font-black">
                              {isWeekOpen ? 'Close ▲' : 'View Days ▼'}
                            </span>
                          </button>

                          {isWeekOpen && (
                            <div className="p-3 space-y-2">
                              {days.map((day) => {
                                const doneCount = (completedExercisesByDay[day.dayNumber] || []).length;
                                const isAllDone = doneCount === day.exercises.length;
                                return (
                                  <button
                                    key={day.dayNumber}
                                    onClick={() => {
                                      setCurrentDayNum(day.dayNumber);
                                      setActiveExIndex(0);
                                      setActiveSection(1);
                                    }}
                                    className="w-full p-3 rounded-2xl border-2 border-emerald-100 hover:border-emerald-300 bg-gradient-to-r from-white to-emerald-50/40 flex items-center justify-between text-left"
                                  >
                                    <div>
                                      <div className="text-xs font-black text-emerald-800">
                                        Day {day.dayNumber} {isAllDone ? '✓' : ''}
                                      </div>
                                      <div className="text-sm font-black text-slate-900">
                                        {day.title}
                                      </div>
                                      <div className="text-[11px] font-semibold text-slate-500">
                                        {day.exercises.length} Exercises • 🔥 {day.estimatedCalories} kcal
                                      </div>
                                    </div>
                                    <span className="px-3 py-1.5 rounded-xl bg-emerald-500 text-white font-black text-xs">
                                      Start ▶
                                    </span>
                                  </button>
                                );
                              })}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {activeSection === 3 && (
                <div className="space-y-3.5">
                  <div className="bg-gradient-to-r from-amber-100 via-orange-50 to-emerald-100 rounded-3xl border-2 border-amber-200 p-4 space-y-2.5">
                    <span className="text-[10px] font-black uppercase text-amber-900 bg-white px-2.5 py-0.5 rounded-full border border-amber-200">
                      Exercise Shorts & Stick-Model Catalog
                    </span>
                    <h2 className="text-base font-black text-slate-900">
                      Tap Any Exercise for Full YT Short or Full Stick Model
                    </h2>
                    <div className="flex gap-1.5 overflow-x-auto no-scrollbar">
                      {['All', 'Bodyweight', 'Resistance', 'Weight Loss', 'Mobility', 'Flexibility'].map(
                        (cat) => (
                          <button
                            key={cat}
                            onClick={() => setCategoryFilter(cat)}
                            className={`px-3 py-1.5 rounded-xl text-xs font-black whitespace-nowrap border ${
                              categoryFilter === cat
                                ? 'bg-amber-500 text-white border-amber-600'
                                : 'bg-white text-slate-700 border-amber-200'
                            }`}
                          >
                            {cat}
                          </button>
                        )
                      )}
                    </div>
                  </div>

                  <div className="space-y-2.5">
                    {EXERCISE_CATALOG.filter(
                      (e) => categoryFilter === 'All' || e.category === categoryFilter
                    ).map((ex) => {
                      const isExpanded = expandedCatalogId === ex.id;
                      return (
                        <div
                          key={ex.id}
                          className="bg-white rounded-3xl border-2 border-emerald-200 overflow-hidden shadow-sm"
                        >
                          <button
                            onClick={() => setExpandedCatalogId(isExpanded ? null : ex.id)}
                            className="w-full p-3.5 text-left flex items-center justify-between gap-2 bg-gradient-to-r from-white to-emerald-50/50"
                          >
                            <div>
                              <div className="flex items-center gap-1.5">
                                <span className={`inline-block text-[10px] font-black px-2 py-0.5 rounded-full border ${ex.themeBadge}`}>
                                  {ex.category}
                                </span>
                                <span className="text-[10px] font-black px-2 py-0.5 rounded-full bg-amber-100 text-amber-900 border border-amber-200">
                                  ⏱ {ex.videoDurationLabel || '20s Short'}
                                </span>
                              </div>
                              <h3 className="text-sm font-black text-slate-900 mt-1">{ex.name}</h3>
                            </div>
                            <span className="px-3 py-1.5 rounded-xl bg-emerald-100 text-emerald-900 text-xs font-black shrink-0">
                              {isExpanded ? 'Hide ▲' : 'Watch Demo ▶'}
                            </span>
                          </button>

                          {isExpanded && (
                            <div className="p-3.5 pt-0 space-y-3 border-t border-emerald-100">
                              <InAppShortPlayer
                                exercise={ex}
                                showTipsDrawer={showTipsDrawer}
                                setShowTipsDrawer={setShowTipsDrawer}
                                activeTipTab={activeTipTab}
                                setActiveTipTab={setActiveTipTab}
                                onSpeakCue={() =>
                                  speakCoachText(`${ex.name}. ${ex.cues.join(' ')}`, true)
                                }
                              />

                              <div className="grid grid-cols-3 gap-2 bg-emerald-50/70 p-2.5 rounded-2xl border border-emerald-200 text-center">
                                <div>
                                  <div className="text-[10px] font-black text-slate-500">MONTH 1</div>
                                  <div className="text-xs font-black text-slate-900">
                                    {ex.defaultSets} × {ex.defaultReps} Reps
                                  </div>
                                </div>
                                <div className="border-x border-emerald-200">
                                  <div className="text-[10px] font-black text-emerald-700">MONTH 2</div>
                                  <div className="text-xs font-black text-slate-900">
                                    {ex.defaultSets + 1} × {Math.round(ex.defaultReps * 1.25)} Reps
                                  </div>
                                </div>
                                <div>
                                  <div className="text-[10px] font-black text-amber-700">MONTH 3</div>
                                  <div className="text-xs font-black text-slate-900">
                                    {ex.defaultSets + 1} × {Math.round(ex.defaultReps * 1.45)} Reps
                                  </div>
                                </div>
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
