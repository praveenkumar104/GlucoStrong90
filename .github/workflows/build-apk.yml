name: Build GlucoStrong 90 Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 3. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 4. Build Native Android WebView APK (Capacitor)
        run: |
          mkdir -p build_app/www
          cp index.html build_app/www/index.html
          cd build_app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "GlucoStrong 90" "com.glucostrong90.fitness" --web-dir www
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.glucostrong90.fitness",
            "appName": "GlucoStrong 90",
            "webDir": "www",
            "server": {
              "url": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/",
              "cleartext": true
            }
          }
          EOF
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 5. Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: GlucoStrong90-Android-APK
          path: build_app/android/app/build/outputs/apk/debug/app-debug.apk
